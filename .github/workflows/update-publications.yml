name: Refresh ORCID publications

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ORCID + Crossref metadata
        run: python scripts/update_publications.py
      - name: Commit changes when metadata changed
        run: |
          if git diff --quiet -- publications.json; then
            echo "No publication metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "chore: refresh ORCID publications"
          git push
